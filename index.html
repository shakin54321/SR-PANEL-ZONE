<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>SR PANEL ZONE</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#263d66 0,transparent 38%),linear-gradient(145deg,#0b1220,#111827 65%,#172554);color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,7vw,56px);border:1px solid #ffffff24;border-radius:28px;background:#ffffff0d;box-shadow:0 24px 80px #0005;backdrop-filter:blur(18px);text-align:center}
    .tag{display:inline-block;padding:7px 12px;border:1px solid #60a5fa55;border-radius:999px;color:#93c5fd;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:22px 0 12px;font-size:clamp(36px,8vw,58px);line-height:1.05;letter-spacing:-.04em}
    p{margin:0;color:#cbd5e1;line-height:1.7;font-size:16px}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:10px 15px;border-radius:999px;background:#16a34a20;color:#86efac;font-size:14px}
    .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80}
    footer{margin-top:34px;color:#94a3b8;font-size:12px}
  </style>
</head>
<body>
  <main>
    <span class="tag">Welcome</span>
    <h1>SR PANEL ZONE</h1>
    <p>Your Cloudflare Pages site is now being set up. This is the starter homepage; your panel interface can be added here next.</p>
    <div class="status"><span class="dot"></span> Pages deployment setup</div>
    <footer>Powered by Cloudflare Pages</footer>
  </main>
</body>
</html>
