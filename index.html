<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta name="theme-color" content="#0b0e14">
<title>SR PANEL ZONE</title>

<style>
  @property --angle{syntax:"<angle>";initial-value:0deg;inherits:false}

  :root{
    --bg:#0b0e14;
    --surface:rgba(17,24,38,.72);
    --surface-solid:#111826;
    --line:rgba(120,150,200,.16);
    --text:#e8f2ff;
    --muted:#6f7f99;
    --cyan:#00e5ff;
    --blue:#2979ff;
    --violet:#7c4dff;
    --green:#00ff9d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}

  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    padding:max(18px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));
    position:relative;overflow-x:hidden;isolation:isolate;
  }

  /* ---------- Background: aurora + grid + scanline ---------- */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 16s ease-in-out infinite}
  .bg .b1{width:420px;height:420px;background:var(--blue);top:-140px;left:-120px}
  .bg .b2{width:360px;height:360px;background:var(--cyan);top:30%;right:-140px;animation-delay:-5s;opacity:.22}
  .bg .b3{width:380px;height:380px;background:var(--violet);bottom:-160px;left:20%;animation-delay:-9s;opacity:.25}
  .bg .grid{
    position:absolute;inset:0;opacity:.5;
    background-image:
      linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);
            mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);
  }
  .bg .scan{
    position:absolute;left:0;right:0;height:140px;top:-140px;
    background:linear-gradient(180deg,transparent,rgba(0,229,255,.06),transparent);
    animation:scan 7s linear infinite;
  }
  @keyframes float{50%{transform:translate(30px,40px) scale(1.08)}}
  @keyframes scan{to{transform:translateY(calc(100vh + 280px))}}

  .wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}

  /* ---------- Top secure bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }
  .topbar .secure{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:700}
  .topbar .secure svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .live{display:inline-flex;align-items:center;gap:7px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.3;transform:scale(.8)}}

  /* ---------- Ad slots ---------- */
  .ad-slot{
    min-height:90px;display:flex;align-items:center;justify-content:center;
    border:1px dashed rgba(111,127,153,.35);border-radius:14px;
    color:var(--muted);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
    background:rgba(255,255,255,.012);overflow:hidden;
  }

  /* ---------- Glass cards with animated border ---------- */
  .card{
    position:relative;border-radius:20px;padding:20px;
    background:var(--surface);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:conic-gradient(from var(--angle),transparent 0 55%,var(--cyan) 75%,var(--blue) 88%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 6s linear infinite;opacity:.9;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    border:1px solid var(--line);
  }
  @keyframes spin{to{--angle:360deg}}

  /* ---------- File card ---------- */
  .file{display:flex;align-items:center;gap:16px}
  .shield{
    position:relative;flex:none;width:72px;height:72px;display:grid;place-items:center;overflow:hidden;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(0,229,255,.28);box-shadow:0 0 14px rgba(0,229,255,.12);
  }
  .shield::before,.shield::after{
    content:"";position:absolute;inset:0;border-radius:18px;
    border:1px solid rgba(0,229,255,.55);
    animation:ping 2.6s cubic-bezier(.2,.6,.3,1) infinite;
  }
  .shield::after{animation-delay:1.3s}
  @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}
  .shield-core{
    position:relative;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(0,229,255,.2),rgba(41,121,255,.08));
    border:1px solid rgba(0,229,255,.5);
    box-shadow:0 0 26px rgba(0,229,255,.3), inset 0 0 18px rgba(0,229,255,.12);
  }
  .shield-core svg{width:32px;height:32px;stroke:var(--cyan);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(0,229,255,.8))}
  .shield-image{width:100% !important;height:100% !important;max-width:none;display:block;object-fit:contain;object-position:center;border-radius:17px;}
  .file-text{min-width:0;flex:1}
  .file-name{font-weight:800;font-size:1.12rem;letter-spacing:.02em;word-break:break-word}
  .file-tag{
    margin-top:6px;display:inline-flex;align-items:center;gap:6px;
    font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    color:var(--green);background:rgba(0,255,157,.08);border:1px solid rgba(0,255,157,.25);
    padding:3px 9px;border-radius:999px;
  }
  .file-tag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .btn-logo{width:30px;height:30px;flex:0 0 30px;object-fit:contain;border-radius:8px;display:block;}

  /* ---------- Steps ---------- */
  .steps{position:relative;padding:2px 0 0}
  .steps-line{position:absolute;left:19px;right:19px;top:17px;height:4px;border-radius:4px;background:rgba(120,150,200,.14);overflow:hidden}
  .steps-fill{
    position:relative;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--blue),var(--cyan));
    box-shadow:0 0 14px var(--cyan);
    transition:width .9s cubic-bezier(.22,1,.36,1);
  }
  .steps-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite;
  }
  @keyframes shine{to{transform:translateX(100%)}}
  .steps ol{list-style:none;display:flex;justify-content:space-between;position:relative}
  .steps li{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:.85rem;color:var(--muted);
    background:var(--surface-solid);border:2px solid rgba(120,150,200,.2);
    transition:all .4s ease;
  }
  .steps li svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .steps li.done{color:#021018;background:linear-gradient(145deg,var(--cyan),var(--blue));border-color:transparent;box-shadow:0 0 14px rgba(0,229,255,.55)}
  .steps li.active{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,229,255,.1),0 0 18px rgba(0,229,255,.55);animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 7px rgba(0,229,255,.04),0 0 8px rgba(0,229,255,.3)}}

  /* ---------- Action ---------- */
  .action{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 20px 24px}
  .step-label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.74rem;letter-spacing:.26em;text-transform:uppercase}
  .step-label b{color:var(--text);font-weight:800}
  .step-label::before,.step-label::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,.6))}
  .step-label::after{transform:scaleX(-1)}
  .action-hint{margin:-6px 0 2px;color:#22c55e;font-size:.88rem;line-height:1.65;text-align:center;max-width:340px;}

  .btn{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;min-height:58px;padding:14px 20px;border:0;border-radius:16px;
    text-decoration:none;cursor:pointer;font:inherit;font-weight:800;font-size:1rem;
    letter-spacing:.14em;text-transform:uppercase;color:#02121a;
    background:linear-gradient(95deg,var(--cyan),var(--blue));
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 10px 30px rgba(41,121,255,.35), 0 0 28px rgba(0,229,255,.35);
    transition:transform .18s ease, filter .2s ease, box-shadow .2s ease;
  }
  .btn::before{
    content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite;
  }
  @keyframes sweep{60%,100%{left:140%}}
  .btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.final{background:linear-gradient(95deg,var(--green),var(--cyan));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 10px 30px rgba(0,255,157,.3),0 0 28px rgba(0,255,157,.35)}
  .btn.linkvertise-btn{color:#fff;background:linear-gradient(110deg,#ff8a00,#ff5a1f);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 10px 30px rgba(255,106,0,.28),0 0 26px rgba(255,106,0,.22)}
  .btn.lootlabs-btn{color:#fff;background:linear-gradient(110deg,#7657ff,#4b35c9);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 10px 30px rgba(105,76,255,.3),0 0 26px rgba(105,76,255,.24)}
  .btn.loading{pointer-events:none;filter:brightness(.85)}
  .btn.loading::before{display:none}
  .spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(2,18,26,.25);border-top-color:#02121a;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  .support-btn img{position:relative;z-index:1;width:145%;height:145%;flex:none;display:block;object-fit:cover;object-position:center;border-radius:50%;transform:none;filter:drop-shadow(0 3px 7px rgba(0,0,0,.38));pointer-events:none}
  .support-btn:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 12px 28px rgba(0,136,255,.4)}

  .support-options{display:grid;gap:10px}
  .support-option{min-height:54px;display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:14px;border:1px solid rgba(150,180,220,.16);background:rgba(255,255,255,.045);color:#f4f8ff;text-decoration:none;font-size:.9rem;font-weight:750;transition:background .18s ease,transform .18s ease,border-color .18s ease}
  .support-option:hover{background:rgba(255,255,255,.09);border-color:rgba(130,190,255,.4);transform:translateY(-1px)}
  .support-option svg{width:28px;height:28px;flex:none;display:block}
  .support-option .support-note{margin-left:auto;font-size:.65rem;font-weight:650;letter-spacing:.04em;color:#8fa2bd}
  .support-option.disabled{opacity:.58;cursor:default}

  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>

<script>
(function(){
  var popup=document.getElementById('supportPopup');
  var launcher=document.querySelector('.support-btn');
  var launcherWrap=document.getElementById('supportLauncherWrap');
  if(!popup||!launcher||!launcherWrap)return;
  function setOpen(open){popup.hidden=!open;launcher.setAttribute('aria-expanded',String(open));}
  var dragState=null;
  var suppressLauncherClick=false;
  var speech=document.getElementById('supportSpeech');
  var helperMessages=['Hi! Need help? I’m here.','কোনো সমস্যা হচ্ছে? আমি সাহায্য করতে পারি!','Download করতে সাহায্য লাগলে বলো।','Need help with a page? Just tap me!','কোনো link কাজ না করলে জানাও।'];
  var messageIndex=0;
  if(speech)window.setInterval(function(){messageIndex=(messageIndex+1)%helperMessages.length;speech.textContent=helperMessages[messageIndex];},5200);
  var orbitStart=performance.now();
  function orbitHelper(now){
    if(!dragState&&popup.hidden&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      var w=launcherWrap.offsetWidth,h=launcherWrap.offsetHeight,pad=10;
      var maxX=Math.max(pad,window.innerWidth-w-pad),maxY=Math.max(pad,window.innerHeight-h-pad);
      var minX=pad,minY=pad,dx=maxX-minX,dy=maxY-minY,perimeter=2*(dx+dy);
      if(perimeter>0){
        var distance=((now-orbitStart)/60000*perimeter)%perimeter,x=maxX,y=maxY;
        if(distance<=dx){x=maxX-distance;y=maxY;}
        else if((distance-=dx)<=dy){x=minX;y=maxY-distance;}
        else if((distance-=dy)<=dx){x=minX+distance;y=minY;}
        else{distance-=dx;x=maxX;y=minY+distance;}
        launcherWrap.style.left=x+'px';launcherWrap.style.top=y+'px';launcherWrap.style.right='auto';launcherWrap.style.bottom='auto';
      }
    }
    window.requestAnimationFrame(orbitHelper);
  }
  window.requestAnimationFrame(orbitHelper);

  launcherWrap.addEventListener('pointerdown',function(event){
    if(!popup.hidden||event.button!==0)return;
    var rect=launcherWrap.getBoundingClientRect();
    dragState={pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,left:rect.left,top:rect.top,moved:false};
    launcherWrap.setPointerCapture(event.pointerId);
  });
  launcherWrap.addEventListener('pointermove',function(event){
    if(!dragState||event.pointerId!==dragState.pointerId)return;
    var dx=event.clientX-dragState.startX,dy=event.clientY-dragState.startY;
    if(Math.abs(dx)+Math.abs(dy)>5)dragState.moved=true;
    if(!dragState.moved)return;
    var maxLeft=Math.max(0,window.innerWidth-launcherWrap.offsetWidth);
    var maxTop=Math.max(0,window.innerHeight-launcherWrap.offsetHeight);
    launcherWrap.style.left=Math.min(maxLeft,Math.max(0,dragState.left+dx))+'px';
    launcherWrap.style.top=Math.min(maxTop,Math.max(0,dragState.top+dy))+'px';
    launcherWrap.style.right='auto';launcherWrap.style.bottom='auto';
    launcherWrap.classList.add('dragging');
  });
  function finishDrag(event){
    if(!dragState||event.pointerId!==dragState.pointerId)return;
    if(dragState.moved){suppressLauncherClick=true;window.setTimeout(function(){suppressLauncherClick=false;},0);}
    dragState=null;launcherWrap.classList.remove('dragging');
  }
  launcherWrap.addEventListener('pointerup',finishDrag);
  launcherWrap.addEventListener('pointercancel',finishDrag);
  document.addEventListener('click',function(event){
    if(suppressLauncherClick&&event.target.closest('#supportLauncherWrap')){suppressLauncherClick=false;event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();return;}
    var target=event.target.closest('[data-support-action]');
    if(!target)return;
    var action=target.getAttribute('data-support-action');
    if(action==='backdrop'&&event.target!==popup)return;
    event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
    if(action==='toggle'){setOpen(popup.hidden);return;}
    if(action==='close'||action==='backdrop'){setOpen(false);return;}
    if(action==='navigate'){var destination=target.getAttribute('href');if(destination)window.location.assign(destination);}
  },true);
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!popup.hidden){setOpen(false);launcher.focus();}});
})();
</script>

<script>
(function () {
  try {
    var params = new URLSearchParams(location.search);
    if (params.get('gate') === 'lv') {
      var lv = JSON.parse(localStorage.getItem('linkvertise_progress_v1') || 'null');
      var q = parseInt(params.get('step'), 10);
      if (lv && Number.isInteger(lv.step) && lv.step >= 1 && lv.step <= 4 &&
          typeof lv.pendingAt === 'number' && typeof lv.awayAt === 'number' &&
          lv.pendingAt && lv.awayAt && q === lv.step + 1 &&
          Date.now() - lv.pendingAt >= 10000 && lv.awayAt <= Date.now()) {
        location.replace('/linkvertise?step=' + q);
      }
      return;
    }
    var state = JSON.parse(localStorage.getItem('safelink_progress_v3') || 'null');
    if (!state || !Number.isInteger(state.step) || state.step < 1 || state.step > 4 ||
        typeof state.pendingAt !== 'number' || typeof state.awayAt !== 'number' ||
        !state.pendingAt || !state.awayAt) return;
    var elapsed = Date.now() - state.pendingAt;
    if (elapsed < 10000 || state.awayAt > Date.now() || elapsed < 0) return;
    var requestedStep = parseInt(params.get('step'), 10);
    if (requestedStep !== state.step + 1) requestedStep = state.step + 1;
    location.replace('/lootlabs?step=' + requestedStep);
  } catch (e) {}
})();
</script>
