<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="same-origin">
<meta name="theme-color" content="#090d17">
<title>Private Admin Access | SR PANEL ZONE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 10%,#172c50 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#24164b 0,transparent 38%),#090d17;color:#edf4ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,410px);padding:30px;border:1px solid #263958;border-radius:26px;background:linear-gradient(145deg,rgba(22,34,56,.94),rgba(12,18,31,.96));box-shadow:0 28px 90px #0009}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#3478ff,#8658ff);box-shadow:0 10px 28px #4b6dff55}.mark svg{width:25px}.eyebrow{margin:22px 0 8px;color:#7fa9ff;font-size:11px;font-weight:800;letter-spacing:.2em}.title{margin:0;font-size:27px;letter-spacing:-.04em}.desc{margin:10px 0 25px;color:#8fa1bd;font-size:13px;line-height:1.65}.field{display:block;margin-bottom:10px;color:#b9c8df;font-size:12px;font-weight:700}.input{width:100%;height:54px;padding:0 16px;border:1px solid #314462;border-radius:14px;outline:none;background:#0a1221;color:#fff;font-size:16px;letter-spacing:.08em}.input:focus{border-color:#6094ff;box-shadow:0 0 0 3px #5086ff22}.submit{width:100%;height:52px;margin-top:16px;border:0;border-radius:14px;background:linear-gradient(110deg,#327cff,#7657f5);color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 12px 30px #3b67e944}.submit:disabled{opacity:.6;cursor:wait}.status{min-height:20px;margin:14px 0 0;color:#ff8f9b;font-size:12px;text-align:center}.foot{margin-top:23px;padding-top:17px;border-top:1px solid #25334b;color:#657895;font-size:10px;text-align:center;letter-spacing:.12em}
</style>
</head>
<body>
<main class="card">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 3 20 6v5c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></div>
  <p class="eyebrow">PRIVATE CONTROL GATE</p>
  <h1 class="title">Admin access</h1>
  <p class="desc">This area is restricted. Enter the private admin password to continue.</p>
  <form id="loginForm">
    <label class="field" for="password">ADMIN PASSWORD</label>
    <input class="input" id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus>
    <button class="submit" id="submit" type="submit">Unlock secure access</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
  <div class="foot">SR PANEL ZONE · AUTHORIZED ACCESS ONLY</div>
</main>
<script>
(async function(){
 const check=await fetch('/api/admin/session',{cache:'no-store',credentials:'same-origin'}).catch(()=>null);
 if(check&&check.ok){const data=await check.json().catch(()=>({}));if(data.ok){location.replace('/sr-control/panel/');return;}}
 const form=document.getElementById('loginForm'),button=document.getElementById('submit'),status=document.getElementById('status'),input=document.getElementById('password');
 function getDeviceToken(){
  let token=localStorage.getItem('sr_admin_device_v1');
  if(!/^[A-Za-z0-9_-]{40,60}$/.test(token||'')){
   const bytes=crypto.getRandomValues(new Uint8Array(32));
   let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);
   token=btoa(binary).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/g,'');
   localStorage.setItem('sr_admin_device_v1',token);
  }
  return token;
 }
 form.addEventListener('submit',async function(event){
  event.preventDefault();button.disabled=true;button.textContent='Checking securely…';status.textContent='';
  try{
   const response=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value,deviceToken:getDeviceToken()})});
   const result=await response.json();
   if(!response.ok||!result.ok){status.textContent=result.error||'Access denied';input.value='';input.focus();return;}
   input.value='';location.replace('/');
  }catch(error){status.textContent='Connection error. Please try again.';}
  finally{button.disabled=false;button.textContent='Unlock secure access';}
 });
})();
</script>
</body>
</html>
