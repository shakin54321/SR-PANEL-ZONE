<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta name="theme-color" content="#0b0e14">
<title>SR PANEL ZONE | Lootlabs</title>

<style>
  @property --angle{syntax:"<angle>";initial-value:0deg;inherits:false}

  :root{
    --bg:#0b0e14;
    --surface:rgba(17,24,38,.72);
    --surface-solid:#111826;
    --line:rgba(120,150,200,.16);
    --text:#e8f2ff;
    --muted:#6f7f99;
    --cyan:#00e5ff;
    --blue:#2979ff;
    --violet:#7c4dff;
    --green:#00ff9d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}

  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    padding:max(18px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));
    position:relative;overflow-x:hidden;isolation:isolate;
  }

  /* ---------- Background: aurora + grid + scanline ---------- */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 16s ease-in-out infinite}
  .bg .b1{width:420px;height:420px;background:var(--blue);top:-140px;left:-120px}
  .bg .b2{width:360px;height:360px;background:var(--cyan);top:30%;right:-140px;animation-delay:-5s;opacity:.22}
  .bg .b3{width:380px;height:380px;background:var(--violet);bottom:-160px;left:20%;animation-delay:-9s;opacity:.25}
  .bg .grid{
    position:absolute;inset:0;opacity:.5;
    background-image:
      linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);
            mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);
  }
  .bg .scan{
    position:absolute;left:0;right:0;height:140px;top:-140px;
    background:linear-gradient(180deg,transparent,rgba(0,229,255,.06),transparent);
    animation:scan 7s linear infinite;
  }
  @keyframes float{50%{transform:translate(30px,40px) scale(1.08)}}
  @keyframes scan{to{transform:translateY(calc(100vh + 280px))}}

  .wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}

  /* ---------- Top secure bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }
  .topbar .secure{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:700}
  .topbar .secure svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .live{display:inline-flex;align-items:center;gap:7px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.3;transform:scale(.8)}}

  /* ---------- Ad slots ---------- */
  .ad-slot{
    min-height:90px;display:flex;align-items:center;justify-content:center;
    border:1px dashed rgba(111,127,153,.35);border-radius:14px;
    color:var(--muted);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
    background:rgba(255,255,255,.012);overflow:hidden;
  }

  /* ---------- Glass cards with animated border ---------- */
  .card{
    position:relative;border-radius:20px;padding:20px;
    background:var(--surface);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:conic-gradient(from var(--angle),transparent 0 55%,var(--cyan) 75%,var(--blue) 88%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 6s linear infinite;opacity:.9;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    border:1px solid var(--line);
  }
  @keyframes spin{to{--angle:360deg}}

  /* ---------- Compact Back to Home ---------- */
  .home-link{
    display:inline-flex;align-self:flex-start;align-items:center;gap:7px;
    min-height:34px;padding:7px 12px;border-radius:10px;
    color:var(--cyan);text-decoration:none;font-size:.78rem;font-weight:700;
    letter-spacing:.02em;background:rgba(0,229,255,.07);
    border:1px solid rgba(0,229,255,.2);
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  .home-arrow{font-size:1rem;line-height:1}
  .home-link:hover{background:rgba(0,229,255,.13);border-color:rgba(0,229,255,.4)}
  .home-link:active{transform:translateY(1px)}
  .home-link:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  /* ---------- File card ---------- */
  .file{display:flex;align-items:center;gap:16px}
  .shield{
    position:relative;flex:none;width:72px;height:72px;display:grid;place-items:center;overflow:hidden;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(0,229,255,.28);box-shadow:0 0 14px rgba(0,229,255,.12);
  }
  .shield::before,.shield::after{
    content:"";position:absolute;inset:0;border-radius:18px;
    border:1px solid rgba(0,229,255,.55);
    animation:ping 2.6s cubic-bezier(.2,.6,.3,1) infinite;
  }
  .shield::after{animation-delay:1.3s}
  @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}
  .shield-image{width:88% !important;height:88% !important;max-width:none;max-height:none;display:block;object-fit:contain;object-position:center;border-radius:15px;}
  .shield-core{
    position:relative;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(0,229,255,.2),rgba(41,121,255,.08));
    border:1px solid rgba(0,229,255,.5);
    box-shadow:0 0 26px rgba(0,229,255,.3), inset 0 0 18px rgba(0,229,255,.12);
  }
  .shield-core svg{width:32px;height:32px;stroke:var(--cyan);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(0,229,255,.8))}
  .file-text{min-width:0;flex:1}
  .file-name{font-weight:800;font-size:1.12rem;letter-spacing:.02em;word-break:break-word}
  .file-tag{
    margin-top:6px;display:inline-flex;align-items:center;gap:6px;
    font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    color:var(--green);background:rgba(0,255,157,.08);border:1px solid rgba(0,255,157,.25);
    padding:3px 9px;border-radius:999px;
  }
  .file-tag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Steps ---------- */
  .steps{position:relative;padding:2px 0 0}
  .steps-line{position:absolute;left:19px;right:19px;top:17px;height:4px;border-radius:4px;background:rgba(120,150,200,.14);overflow:hidden}
  .steps-fill{
    position:relative;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--blue),var(--cyan));
    box-shadow:0 0 14px var(--cyan);
    transition:width .9s cubic-bezier(.22,1,.36,1);
  }
  .steps-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite;
  }
  @keyframes shine{to{transform:translateX(100%)}}
  .steps ol{list-style:none;display:flex;justify-content:space-between;position:relative}
  .steps li{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:.85rem;color:var(--muted);
    background:var(--surface-solid);border:2px solid rgba(120,150,200,.2);
    transition:all .4s ease;
  }
  .steps li svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .steps li.done{color:#021018;background:linear-gradient(145deg,var(--cyan),var(--blue));border-color:transparent;box-shadow:0 0 14px rgba(0,229,255,.55)}
  .steps li.active{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,229,255,.1),0 0 18px rgba(0,229,255,.55);animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 7px rgba(0,229,255,.04),0 0 8px rgba(0,229,255,.3)}}

  /* ---------- Action ---------- */
  .action{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 20px 24px}
  .step-label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.74rem;letter-spacing:.26em;text-transform:uppercase}
  .step-label b{color:var(--text);font-weight:800}
  .step-label::before,.step-label::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,.6))}
  .step-label::after{transform:scaleX(-1)}

  .btn{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;min-height:58px;padding:14px 20px;border:0;border-radius:16px;
    text-decoration:none;cursor:pointer;font:inherit;font-weight:800;font-size:1rem;
    letter-spacing:.14em;text-transform:uppercase;color:#02121a;
    background:linear-gradient(95deg,var(--cyan),var(--blue));
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 10px 30px rgba(41,121,255,.35), 0 0 28px rgba(0,229,255,.35);
    transition:transform .18s ease, filter .2s ease, box-shadow .2s ease;
  }
  .btn::before{
    content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite;
  }
  @keyframes sweep{60%,100%{left:140%}}
  .btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.final{color:#f8fbff;letter-spacing:.08em;border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(0,0,0,.24),0 0 0 1px rgba(255,255,255,.08) inset}
  .btn.final#mainBtn{background:linear-gradient(110deg,#3157d5 0%,#6747d9 52%,#8b5cf6 100%);box-shadow:0 10px 28px rgba(79,70,229,.32),0 0 0 1px rgba(255,255,255,.12) inset}
  .btn.final#secondDownloadBtn{background:linear-gradient(110deg,#087f68 0%,#0caa78 55%,#20b889 100%);box-shadow:0 10px 28px rgba(5,150,105,.28),0 0 0 1px rgba(255,255,255,.12) inset}
  .btn{color:#fff;background:linear-gradient(110deg,#7657ff 0%,#6246e8 55%,#4b35c9 100%);box-shadow:0 10px 28px rgba(105,76,255,.30),0 0 0 1px rgba(255,255,255,.12) inset}
  .btn.final#mainBtn,.btn.final#secondDownloadBtn{color:#fff;background:linear-gradient(110deg,#7657ff 0%,#6246e8 55%,#4b35c9 100%);box-shadow:0 10px 28px rgba(105,76,255,.30),0 0 0 1px rgba(255,255,255,.12) inset}
  .btn-logo{width:34px;height:34px;flex:0 0 34px;object-fit:cover;border-radius:9px;border:1px solid rgba(255,255,255,.35);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .btn-label{position:relative;z-index:1}
  .btn.loading{pointer-events:none;filter:brightness(.85)}
  .btn.loading::before{display:none}
  .spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(2,18,26,.25);border-top-color:#02121a;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

    /* ---------- Floating support launcher + contact popup ---------- */
  .support-launcher-wrap{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));left:auto;top:auto;z-index:1001;display:flex;flex-direction:column;align-items:center;gap:3px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;will-change:left,top}
  .support-launcher-wrap::before{content:"";position:absolute;top:-14px;left:-14px;width:88px;height:88px;border-radius:50%;background:radial-gradient(ellipse at 22% 34%,rgba(255,49,88,.78),transparent 43%),radial-gradient(ellipse at 72% 24%,rgba(255,157,36,.72),transparent 42%),radial-gradient(ellipse at 82% 62%,rgba(255,240,42,.62),transparent 43%),radial-gradient(ellipse at 58% 82%,rgba(57,232,121,.72),transparent 44%),radial-gradient(ellipse at 20% 76%,rgba(32,217,255,.72),transparent 43%),radial-gradient(ellipse at 48% 42%,rgba(88,101,255,.58),transparent 48%),radial-gradient(ellipse at 76% 48%,rgba(193,59,255,.62),transparent 44%);filter:blur(13px);opacity:.62;animation:supportRainbowGlow 4s linear infinite;pointer-events:none;z-index:0}
  @keyframes supportRainbowGlow{to{transform:rotate(360deg)}}.support-btn{position:relative;right:auto;bottom:auto;z-index:1;display:flex;align-items:center;justify-content:center;width:60px;height:60px;padding:0;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,.20));border:0;backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);box-shadow:inset 0 1px 3px rgba(255,255,255,.62),inset 0 -1px 2px rgba(255,255,255,.18),0 8px 24px rgba(0,136,255,.18);transition:transform .24s cubic-bezier(.2,.8,.2,1),filter .2s ease,box-shadow .2s ease;cursor:pointer;touch-action:none}.support-launcher-wrap.dragging{cursor:grabbing}.support-launcher-label{font-size:10px;line-height:1.2;font-weight:700;letter-spacing:.02em;color:#eaf4ff;text-shadow:0 1px 4px rgba(0,0,0,.85);white-space:nowrap;pointer-events:none}
  .support-btn img{position:relative;z-index:1;width:145%;height:145%;flex:none;display:block;object-fit:cover;object-position:center;border-radius:50%;transform:none;filter:drop-shadow(0 3px 7px rgba(0,0,0,.38));pointer-events:none}
  .support-btn:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 12px 28px rgba(0,136,255,.4)}
  @keyframes supportButtonTap{0%{transform:scale(1) rotate(0)}35%{transform:scale(.86) rotate(-7deg)}68%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
  .support-btn:active{animation:supportButtonTap .38s cubic-bezier(.2,.8,.2,1)}
  .support-btn:focus-visible,.support-option:focus-visible,.support-close:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .support-popup[hidden]{display:none}
  .support-popup{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:flex-end;padding:18px max(18px,env(safe-area-inset-right)) calc(76px + env(safe-area-inset-bottom)) 18px;background:rgba(2,8,18,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .support-panel{width:min(100%,330px);padding:18px;border-radius:22px;background:rgba(12,20,34,.97);border:1px solid rgba(120,190,255,.28);box-shadow:0 22px 65px rgba(0,0,0,.55),0 0 28px rgba(0,150,255,.14);animation:supportPop .22s cubic-bezier(.2,.8,.2,1) both}
  @keyframes supportPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .support-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .support-title{font-size:1rem;font-weight:850;letter-spacing:.04em;color:#f2f8ff}
  .support-subtitle{font-size:.76rem;color:#9aacc5;margin-top:3px}
  .support-close{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(160,190,230,.2);border-radius:50%;background:rgba(255,255,255,.06);color:#eaf4ff;font-size:20px;cursor:pointer}
  .support-options{display:grid;gap:10px}
  .support-option{min-height:54px;display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:14px;border:1px solid rgba(150,180,220,.16);background:rgba(255,255,255,.045);color:#f4f8ff;text-decoration:none;font-size:.9rem;font-weight:750;transition:background .18s ease,transform .18s ease,border-color .18s ease}
  .support-option:hover{background:rgba(255,255,255,.09);border-color:rgba(130,190,255,.4);transform:translateY(-1px)}
  .support-option svg{width:28px;height:28px;flex:none;display:block}
  .support-option .support-note{margin-left:auto;font-size:.65rem;font-weight:650;letter-spacing:.04em;color:#8fa2bd}
  .support-option.disabled{opacity:.58;cursor:default}
  .support-option.disabled:hover{transform:none;background:rgba(255,255,255,.045);border-color:rgba(150,180,220,.16)}
  @media(max-width:420px){.support-popup{padding-left:14px;padding-right:14px}.support-panel{width:100%}}
  /* Premium support popup + gentle companion hide/show */
   .support-popup{align-items:center;justify-content:center;padding:20px;background:rgba(5,12,25,.58);-webkit-backdrop-filter:blur(12px) saturate(125%);backdrop-filter:blur(12px);animation:supportBackdropIn .28s ease both}
   @keyframes supportBackdropIn{from{opacity:0}to{opacity:1}}
   .support-panel{position:relative;overflow:hidden;width:min(100%,370px);padding:24px 22px 20px;border-radius:26px;background:linear-gradient(155deg,rgba(22,36,58,.98),rgba(9,17,31,.98));border:1px solid rgba(164,207,255,.22);box-shadow:0 28px 90px rgba(0,0,0,.52),0 0 42px rgba(50,145,255,.13);animation:supportPanelEnter .42s cubic-bezier(.2,.85,.25,1) both}
   .support-panel::before{content:"";position:absolute;inset:0 12% auto;height:2px;background:linear-gradient(90deg,transparent,#75d8ff,#b5a0ff,#ffb6da,transparent);opacity:.9}
   .support-panel::after{content:"";position:absolute;width:190px;height:190px;right:-105px;top:-115px;border-radius:50%;background:radial-gradient(circle,rgba(82,164,255,.2),transparent 70%);pointer-events:none}
   @keyframes supportPanelEnter{0%{opacity:0;transform:translateY(18px) scale(.94)}65%{opacity:1;transform:translateY(-3px) scale(1.012)}100%{opacity:1;transform:translateY(0) scale(1)}}
   .support-head{position:relative;z-index:1;align-items:flex-start;margin-bottom:20px;padding-right:4px}
   .support-title{font-size:1.18rem;letter-spacing:-.025em;color:#f7fbff}
   .support-title::before{content:"SUPPORT CENTER";display:block;margin-bottom:7px;color:#8fcfff;font-size:.62rem;font-weight:850;letter-spacing:.17em}
   .support-subtitle{max-width:260px;margin-top:6px;color:#a9bad0;font-size:.78rem;line-height:1.5}
   .support-close{flex:none;width:36px;height:36px;border-color:rgba(190,215,245,.18);background:rgba(255,255,255,.07);font-size:22px;transition:background .2s ease,transform .2s ease}
   .support-close:hover{background:rgba(255,255,255,.15);transform:rotate(90deg)}
   .support-options{position:relative;z-index:1;gap:11px}
   .support-option{min-height:62px;padding:12px 15px;border-radius:17px;border-color:rgba(164,195,230,.14);background:linear-gradient(110deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.055);font-size:.91rem;transition:background .22s ease,transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s ease,box-shadow .22s ease}
   .support-option:hover{background:linear-gradient(110deg,rgba(105,178,255,.17),rgba(255,255,255,.06));border-color:rgba(133,196,255,.42);transform:translateY(-2px);box-shadow:0 9px 24px rgba(0,0,0,.18)}
   .support-option svg{width:31px;height:31px}
   .support-option .support-note{color:#a9bdd5;font-size:.66rem}
   .support-option.disabled{opacity:.52}
   .support-launcher-wrap{transition:opacity .38s ease,visibility 0s linear 0s,left 2.7s cubic-bezier(.22,.75,.25,1),top 2.7s cubic-bezier(.22,.75,.25,1),right .2s,bottom .2s,transform .38s cubic-bezier(.2,.8,.2,1)}
   .support-launcher-wrap.support-suspended{opacity:0!important;visibility:hidden;pointer-events:none;transform:scale(.82);transition:opacity .38s ease,visibility 0s linear .38s,transform .38s cubic-bezier(.2,.8,.2,1)}
   @media(max-width:420px){.support-popup{align-items:center;padding:16px}.support-panel{width:100%;padding:22px 18px 18px;border-radius:23px}}
   @media(prefers-reduced-motion:reduce){.support-popup,.support-panel,.support-launcher-wrap{animation:none!important;transition:none!important}}
   .support-speech{position:absolute;left:50%;bottom:calc(100% + 13px);transform:translateX(-50%);width:max-content;max-width:min(220px,68vw);padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.035);color:#f5fbff;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(3px) saturate(115%);-webkit-backdrop-filter:blur(3px) saturate(115%);font-size:12px;line-height:1.35;font-weight:750;text-align:center;text-shadow:0 1px 5px rgba(0,0,0,.35);box-shadow:0 8px 26px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.22);pointer-events:none;animation:supportSpeechIn .35s ease both,supportBubbleFloat 3.8s ease-in-out infinite;z-index:3}
  .support-speech::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(255,255,255,.035);filter:drop-shadow(0 2px 1px rgba(255,255,255,.18))}
  @keyframes supportBubbleFloat{0%,100%{translate:0 0}50%{translate:0 -3px}}

    if(!speech)return;

    var w=launcherWrap.offsetWidth,h=launcherWrap.offsetHeight;
    var margin=25, minX=margin,minY=margin;
    var maxX=window.innerWidth-w-margin,maxY=window.innerHeight-h-margin;
    if(maxX<minX||maxY<minY)return null;
    var obstacles=Array.from(document.querySelectorAll('a,button,input,select,textarea,[role="button"],[role="link"]'))
      .filter(function(el){return !launcherWrap.contains(el)&&!popup.contains(el)&&el.getClientRects().length;})

      var x=minX+Math.random()*(maxX-minX),y=minY+Math.random()*(maxY-minY);

    if(!dragState||event.pointerId!==dragState.pointerId)return;
    var dx=event.clientX-dragState.startX,dy=event.clientY-dragState.startY;
    if(Math.abs(dx)+Math.abs(dy)>5)dragState.moved=true;
    if(!dragState.moved)return;
    var edge=25;
    var maxLeft=Math.max(edge,window.innerWidth-launcherWrap.offsetWidth-edge);
    var maxTop=Math.max(edge,window.innerHeight-launcherWrap.offsetHeight-edge);
    launcherWrap.style.left=Math.min(maxLeft,Math.max(edge,dragState.left+dx))+'px';
    launcherWrap.style.top=Math.min(maxTop,Math.max(edge,dragState.top+dy))+'px';
    launcherWrap.style.right='auto';launcherWrap.style.bottom='auto';
    launcherWrap.classList.add('dragging');
  });
  function finishDrag(event){
    if(!dragState||event.pointerId!==dragState.pointerId)return;
    if(dragState.moved){suppressLauncherClick=true;window.setTimeout(function(){suppressLauncherClick=false;},0);}
    dragState=null;launcherWrap.classList.remove('dragging');
  }
  launcherWrap.addEventListener('pointerup',finishDrag);
  launcherWrap.addEventListener('pointercancel',finishDrag);
  document.addEventListener('click',function(event){
    if(suppressLauncherClick&&event.target.closest('#supportLauncherWrap')){suppressLauncherClick=false;event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();return;}
    var target=event.target.closest('[data-support-action]');
    if(!target)return;
    var action=target.getAttribute('data-support-action');
    if(action==='backdrop'&&event.target!==popup)return;
    event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
    if(action==='toggle'){setOpen(popup.hidden);return;}
    if(action==='close'||action==='backdrop'){setOpen(false);return;}
    if(action==='navigate'){var destination=target.getAttribute('href');if(destination)window.location.assign(destination);}
  },true);
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!popup.hidden){setOpen(false);launcher.focus();}});
})();

          typeof s.pendingAt === 'number' && typeof s.savedAt === 'number') {
        var awayAt = typeof s.awayAt === 'number' ? s.awayAt : 0;
        var validSignature = s.sig === sign(s.step, s.pendingAt, s.savedAt, awayAt) ||
          (!awayAt && s.sig === legacySign(s.step, s.pendingAt, s.savedAt));
        var age = Date.now() - s.savedAt;
        var validAge = age >= 0 && (awayAt > 0 ? awayAt <= Date.now() : age < SAVE_TTL_MS);
        if (validSignature && validAge) {
          return { step: s.step, pendingAt: s.pendingAt, savedAt: s.savedAt, awayAt: awayAt };
        }
      }
    } catch (e) {}
    return { step: 1, pendingAt: 0, savedAt: 0, awayAt: 0 };
  }
  function persistState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        step: state.step, pendingAt: state.pendingAt, savedAt: state.savedAt,
        awayAt: state.awayAt, sig: sign(state.step, state.pendingAt, state.savedAt, state.awayAt)
      }));
    } catch (e) {}
  }
  function scheduleExpiry() {
    if (expiryTimer) clearTimeout(expiryTimer);
    expiryTimer = null;
    if (state.awayAt || !state.savedAt) return; // Lootlabs time is paused.
    var remaining = SAVE_TTL_MS - (Date.now() - state.savedAt);
    if (remaining <= 0) {
      state = { step: 1, pendingAt: 0, savedAt: 0, awayAt: 0 };
      persistState();
      render();
      return;
    }
    expiryTimer = setTimeout(function () {
      if (!state.awayAt && Date.now() - state.savedAt >= SAVE_TTL_MS) {
        state = { step: 1, pendingAt: 0, savedAt: 0, awayAt: 0 };
        persistState();
        render();
      } else {
        scheduleExpiry();
      }
    }, remaining);
  }
  function saveState() {
    state.savedAt = Date.now();
    persistState();
    scheduleExpiry();
  }
  function resumeTimerAfterAway() {
    if (!state.awayAt) return;
    var awayDuration = Date.now() - state.awayAt;
    if (awayDuration >= 0) state.savedAt += awayDuration;
    state.awayAt = 0;
    persistState();
    scheduleExpiry();
  }

  function isConfigured(url) {
    return typeof url === 'string' && /^https?:\/\//i.test(url) && !/PASTE/i.test(url) && !/your-actual-file-link/i.test(url);
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  function setLoading(on) {
    if (on) {
      btn.classList.add('loading');
      btn.innerHTML = '<span class="spinner"></span>Connecting';
    } else {
      btn.classList.remove('loading');
    }
  }

  // ---------- Render ----------
  function render() {
    for (var i = 0; i < TOTAL_STEPS; i++) {
      var n = i + 1;
      stepItems[i].className = n < state.step ? 'done' : (n === state.step ? 'active' : '');
      if (n < state.step) stepItems[i].innerHTML = CHECK_SVG; else stepItems[i].textContent = String(n);
    }
    $('stepsFill').style.width = ((state.step - 1) / (TOTAL_STEPS - 1) * 100) + '%';
    $('stepLabel').innerHTML = 'Step <b>' + state.step + '</b> / ' + TOTAL_STEPS;

    setLoading(false);
    btn.style.pointerEvents = '';
    secondBtn.style.pointerEvents = '';
    if (state.step === TOTAL_STEPS) {
      btn.innerHTML = '<img class="btn-logo" src="https://i.postimg.cc/nLRZYXbp/Screenshot-2026-11-11-15-18-30-96-f6753c6c6bd60d52382a99e787ed0d57.jpg" alt="" loading="lazy"><span class="btn-label">XYZ 2.1 [100% Antiban]</span>';
      btn.classList.add('final');
      btn.href = isConfigured(FINAL_DOWNLOAD_LINK) ? FINAL_DOWNLOAD_LINK : '#';
      secondBtn.innerHTML = '<img class="btn-logo" src="https://i.postimg.cc/L4CM3z2b/Screenshot-2026-11-12-10-07-43-59-b783bf344239542886fee7b48fa4b892.jpg" alt="" loading="lazy"><span class="btn-label">M1NX VIP [New v2]</span>';
      secondBtn.hidden = false;
      secondBtn.href = isConfigured(SECOND_DOWNLOAD_LINK) ? SECOND_DOWNLOAD_LINK : '#';
    } else {
      btn.textContent = 'Start';
      btn.classList.remove('final');
      var link = lootlabsLinks[state.step];
      btn.href = isConfigured(link) ? link : '#';
      secondBtn.hidden = true;
      secondBtn.href = '#';
    }

    // keep the URL in sync so a refresh stays on the same step
    try { history.replaceState(null, '', '?step=' + state.step); } catch (e) {}
  }

  // ---------- Click: Lootlabs steps and one-choice final download ----------
  function handleMainButtonClick(e) {
    var isFinal = state.step === TOTAL_STEPS;
    var url = isFinal ? FINAL_DOWNLOAD_LINK : lootlabsLinks[state.step];
    if (!isConfigured(url)) {
      e.preventDefault();
      toast('লিংক সেট করা হয়নি! কোডের ভেতরে লিংকগুলো চেক করুন।');
      return;
    }
    if (isFinal) {
      // One completed run allows exactly one panel choice.
      btn.style.pointerEvents = 'none';
      secondBtn.style.pointerEvents = 'none';
      state = { step: 1, pendingAt: 0, savedAt: 0, awayAt: 0 };
      saveState();
    } else {
      state.pendingAt = Date.now(); // saved BEFORE leaving the page
      state.awayAt = Date.now(); // pause the 5-minute timer while on Lootlabs
      saveState();
      setLoading(true);
    }
  }
  btn.addEventListener('click', handleMainButtonClick);

  secondBtn.addEventListener('click', function (e) {
    if (state.step !== TOTAL_STEPS) {
      e.preventDefault();
      toast('দুটি Download option পেতে আগে ৫টি Step complete করুন।');
      return;
    }
    if (!isConfigured(SECOND_DOWNLOAD_LINK)) {
      e.preventDefault();
      toast('দ্বিতীয় Download link সেট করা হয়নি।');
      return;
    }
    // Lock both choices and reset progress before opening the selected panel.
    btn.style.pointerEvents = 'none';
    secondBtn.style.pointerEvents = 'none';
    state = { step: 1, pendingAt: 0, savedAt: 0, awayAt: 0 };
    saveState();
  });

  // ---------- Return from Lootlabs: ?step=N ----------
  // The next step unlocks only if the user really clicked START on the current step
  // and the URL asks for exactly the next step. Typing ?step=5 does nothing.
  function handleReturn() {
    var q = parseInt(new URLSearchParams(location.search).get('step'), 10);
    if (!q || q !== state.step + 1 || !state.pendingAt) return;
    if (Date.now() - state.pendingAt >= MIN_AWAY_SECONDS * 1000) {
      state.step += 1;
      state.pendingAt = 0;
      saveState();
    } else {
      toast('অনুগ্রহ করে Lootlabs-এর টাস্ক কমপ্লিট করুন।');
    }
  }

  function init() {
    state = loadState();
    resumeTimerAfterAway();
    handleReturn();
    render();
    // Start the five-minute expiry timer for progress restored from storage too.
    scheduleExpiry();
  }

  // back button (bfcache) and other tabs
  window.addEventListener('pageshow', function (e) { if (e.persisted) init(); });
  window.addEventListener('storage', function (e) { if (e.key === STORAGE_KEY) init(); });

  init();
})();
</script>
